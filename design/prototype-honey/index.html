<title>轻松熊 蜜位原型</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
/* 第三稿：iOS 原生化。分组背景 + inset grouped 卡片 + 大标题导航 + Liquid Glass 工具栏与罐壳；颜色全部取 iOS 系统色 */
:root{
  --page: #E8E5DC;
  --bg: #F4F2EC;                 /* 纸白底（近似 Claude 的暖纸色） */
  --card: #FBFAF7;               /* 卡片：比底色亮一级的纸白 */
  --fill: rgba(120,120,128,.12); /* tertiarySystemFill */
  --ink: #000000;                /* label */
  --ink-2: rgba(60,60,67,.6);    /* secondaryLabel */
  --ink-3: rgba(60,60,67,.3);    /* tertiaryLabel */
  --line: rgba(60,60,67,.18);    /* separator */
  --tint: #FF9500;               /* App 强调色 = systemOrange */
  --honey-hi: #FFCC00;           /* systemYellow */
  --honey-lo: #FF9500;           /* systemOrange */
  --honey-ink: rgba(60,30,0,.62);
  --ember-hi: #FF6961;
  --ember-lo: #FF3B30;           /* systemRed */
  --ember-ink: #FF3B30;
  --codex: #34C759;              /* systemGreen */
  --claude: #A2845E;             /* systemBrown */
  --deepseek: #5856D6;           /* systemIndigo */
  --relay: #32ADE6;              /* systemCyan */
  --glass: rgba(255,255,255,.62);
  --glass-rim: rgba(255,255,255,.95);
  --glass-shade: rgba(0,0,0,.07);
  --glass-in: rgba(120,120,128,.08);
  --sheen: rgba(255,255,255,.7);
  --bear: #A2845E; --bear-muzzle: #E9D9C2;
  --ctrl: rgba(255,255,255,.7); --ctrl-on: #1C1C1E; --ctrl-on-ink: #FFFFFF;
  --wall-a: #C9B79C; --wall-b: #6D7FA6; --widget: #FBFAF7;
  --num: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
  --text: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page: #1A1A19; --bg: #262624; --card: #30302E; --fill: rgba(118,118,128,.24);
  --ink: #FFFFFF; --ink-2: rgba(235,235,245,.6); --ink-3: rgba(235,235,245,.3); --line: rgba(84,84,88,.6);
  --tint: #FF9F0A; --honey-hi: #FFD60A; --honey-lo: #FF9F0A; --honey-ink: rgba(50,25,0,.7);
  --ember-hi: #FF6B60; --ember-lo: #FF453A; --ember-ink: #FF453A;
  --codex: #30D158; --claude: #AC8E68; --deepseek: #5E5CE6; --relay: #64D2FF;
  --glass: rgba(255,255,255,.07); --glass-rim: rgba(255,255,255,.22); --glass-shade: rgba(0,0,0,.4); --glass-in: rgba(255,255,255,.04);
  --sheen: rgba(255,255,255,.35); --bear: #AC8E68; --bear-muzzle: #E9D9C2;
  --ctrl: rgba(44,44,46,.8); --ctrl-on: #F2F2F7; --ctrl-on-ink: #000000;
  --wall-a: #4A3E30; --wall-b: #1D2433; --widget: #30302E; color-scheme: dark}}
:root[data-theme="dark"]{
  --page: #1A1A19; --bg: #262624; --card: #30302E; --fill: rgba(118,118,128,.24);
  --ink: #FFFFFF; --ink-2: rgba(235,235,245,.6); --ink-3: rgba(235,235,245,.3); --line: rgba(84,84,88,.6);
  --tint: #FF9F0A; --honey-hi: #FFD60A; --honey-lo: #FF9F0A; --honey-ink: rgba(50,25,0,.7);
  --ember-hi: #FF6B60; --ember-lo: #FF453A; --ember-ink: #FF453A;
  --codex: #30D158; --claude: #AC8E68; --deepseek: #5E5CE6; --relay: #64D2FF;
  --glass: rgba(255,255,255,.07); --glass-rim: rgba(255,255,255,.22); --glass-shade: rgba(0,0,0,.4); --glass-in: rgba(255,255,255,.04);
  --sheen: rgba(255,255,255,.35); --bear: #AC8E68; --bear-muzzle: #E9D9C2;
  --ctrl: rgba(44,44,46,.8); --ctrl-on: #F2F2F7; --ctrl-on-ink: #000000;
  --wall-a: #4A3E30; --wall-b: #1D2433; --widget: #30302E; color-scheme: dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.wrap{display:grid;grid-template-columns:minmax(0,300px) 390px;gap:40px;justify-content:center;align-items:start;padding-block:28px}
@media (max-width:760px){.wrap{grid-template-columns:minmax(0,1fr);gap:12px;padding-block:10px}}

/* ---------- 控制面板 ---------- */
.panel{display:flex;flex-direction:column;gap:18px;position:sticky;top:28px}
.brand h1{font-size:22px;margin:0 0 4px}
.brand p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.6}
.grp{display:flex;flex-direction:column;gap:6px}
.grp>span{font-size:12px;color:var(--ink-2)}
.seg{display:flex;flex-wrap:wrap;gap:2px;background:var(--fill);padding:2px;border-radius:9px}
.seg button{flex:1 1 auto;border:0;background:transparent;padding:6px 9px;border-radius:7px;font-size:13px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.tune{border-radius:12px;background:var(--card);padding:10px 12px}
.tune summary{cursor:pointer;font-size:13px;font-weight:600}
.tune .row{display:grid;grid-template-columns:64px 1fr 44px;gap:8px;align-items:center;font-size:12px;margin-top:8px}
.tune .row output{font-family:var(--num);font-variant-numeric:tabular-nums;text-align:right}
.tune input{width:100%;accent-color:var(--tint)}
.tune .k{font-size:11px;color:var(--ink-2);margin-top:10px;line-height:1.5}
.tune .copy{margin-top:8px;border:0;background:var(--fill);border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;color:var(--tint);font-weight:600}
@media (max-width:760px){
  .panel{position:static;gap:10px}
  .brand{display:none}
  .ctrls{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .ctrls .grp{flex:0 0 auto}
  .ctrls .grp>span{display:none}
  .tune-desk{display:none}
}
@media (min-width:761px){.tune-mob{display:none}.ctrls{display:flex;flex-direction:column;gap:14px}}

/* ---------- 机身 ---------- */
.device{width:390px;height:844px;border-radius:55px;background:var(--bg);position:relative;overflow:hidden;
  box-shadow:0 0 0 10px #1a1a1c,0 30px 60px -20px rgba(0,0,0,.45);isolation:isolate}
@media (max-width:760px){.device{width:100%;height:min(844px,calc(100dvh - 70px));border-radius:28px;box-shadow:0 0 0 1px var(--line)}}
.statusbar{position:absolute;inset:0 0 auto;height:50px;display:flex;justify-content:space-between;align-items:center;padding:0 32px;font:600 16px var(--text);z-index:30;pointer-events:none}
@media (max-width:760px){.statusbar{display:none}}
.island{width:122px;height:35px;border-radius:20px;background:#000}
.view{position:absolute;inset:0}
.home{transform-origin:50% 40%}
.scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none;padding-top:54px}
@media (max-width:760px){.scroller{padding-top:6px}}
.scroller::-webkit-scrollbar{display:none}
.content{padding:0 16px 40px}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;z-index:5}

/* Liquid Glass 工具栏按钮 */
.glassbtn{width:44px;height:44px;border-radius:22px;border:0;display:grid;place-items:center;cursor:pointer;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);
  box-shadow:inset 0 0 0 .5px var(--glass-rim),inset 0 1px 0 var(--glass-rim),0 2px 10px var(--glass-shade)}
.glassbtn svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spin svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 导航：大标题 → 滚动后收成内联标题 + 玻璃栏 */
.navbar{position:absolute;left:0;right:0;top:0;z-index:8;height:106px;pointer-events:none}
@media (max-width:760px){.navbar{height:58px}}
.navbar .barbg{position:absolute;inset:0;background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(1.8);-webkit-backdrop-filter:blur(20px) saturate(1.8);
  opacity:0;border-bottom:.5px solid var(--line)}
.navbar .row{position:absolute;left:16px;right:16px;bottom:8px;height:44px;display:flex;align-items:center;justify-content:space-between}
.navbar .inline{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;opacity:0}
.navbar .btns{margin-left:auto;display:flex;gap:10px;pointer-events:auto}
.largetitle{font-size:34px;line-height:41px;font-weight:700;letter-spacing:.01em;margin:52px 4px 14px;transform-origin:0 50%}
@media (max-width:760px){.largetitle{margin-top:52px}}

/* inset grouped 卡片 */
.card{background:var(--card);border-radius:26px;padding:16px}
.shead{font-size:13px;color:var(--ink-2);margin:26px 16px 8px;display:flex;justify-content:space-between}
.status{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.status .say{font-size:22px;line-height:28px;font-weight:700;text-wrap:balance}
.status .say em{font-style:normal;color:var(--ember-ink)}
.nb{white-space:nowrap;display:inline-block;margin-right:.3em}
.clk{width:11px;height:11px;vertical-align:-1px;margin-right:3px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.status .sub{font-size:15px;line-height:20px;color:var(--ink-2);margin-top:4px;font-variant-numeric:tabular-nums}
.bear{width:56px;height:56px;transform-origin:50% 90%}

/* 双格蜜罐（罐壳 = Liquid Glass） */
.jars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.jarbtn{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;min-width:0}
.jhead{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600;margin:0 2px 8px;height:20px}
.jhead i{width:8px;height:8px;border-radius:4px;flex:none}
.jhead .tag{margin-left:auto;font-size:13px;font-weight:400;color:var(--ink-2)}
.jhead svg{margin-left:auto;width:13px;height:13px;stroke:var(--ink-3);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.jar{position:relative;border-radius:28px;box-shadow:0 1px 2px var(--glass-shade),0 8px 22px -12px var(--glass-shade)}
.jar svg{display:block;width:100%;height:auto}
.jar svg stop{transition:stop-color .45s ease}
.cells{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;pointer-events:none}
.cell{display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:14px 0 12px}
.cell .n{font-family:var(--num);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.cell .n small{font-size:13px;font-weight:700;margin-left:1px;color:var(--ink-2)}
.cell .n.warn{color:var(--ember-ink)}
.cell .lab{font-size:12px;font-weight:600;color:var(--honey-ink)}
.cell .lab.onwarn{color:rgba(255,255,255,.95)}
.cell .lab.dry{color:var(--ink-2)}
.under{display:grid;grid-template-columns:1fr 1fr;margin-top:8px}
.under span{text-align:center;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.under span b{font-weight:600;color:var(--ink)}

/* 时间尺（卡片内） */
.ruler{margin-top:18px;padding-top:14px;border-top:.5px solid var(--line);user-select:none;-webkit-user-select:none}
.rhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;gap:8px}
.rhead b{font-size:15px;font-weight:600;white-space:nowrap}
.rhead span{color:var(--ink-2);font-size:13px;white-space:nowrap}
.track{position:relative;height:48px;touch-action:none;cursor:grab}
.track .base{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--fill)}
.track .past{position:absolute;left:0;top:20px;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--honey-hi),var(--honey-lo))}
.mid{position:absolute;top:20px;width:1.5px;height:6px;background:var(--card)}
.tick{position:absolute;top:32px;font-size:11px;color:var(--ink-2);transform:translateX(-50%);white-space:nowrap}
.rdot{position:absolute;width:9px;height:9px;border-radius:5px;transform:translate(-50%,-50%);box-shadow:0 0 0 2px var(--card)}
.thumb{position:absolute;top:0;height:48px;width:0}
.thumb .knob{position:absolute;left:-14px;top:9px;width:28px;height:28px;border-radius:14px;background:#FFFEFB;box-shadow:0 .5px 4px rgba(0,0,0,.12),0 6px 13px rgba(0,0,0,.12)}

/* 余额：设置 App 式列表 */
.list{background:var(--card);border-radius:26px;overflow:hidden}
.lrow{display:grid;grid-template-columns:30px 1fr auto 14px;gap:12px;align-items:center;padding:11px 16px;border:0;background:transparent;width:100%;text-align:left;cursor:pointer;min-height:60px;position:relative}
.lrow+.lrow::before{content:"";position:absolute;top:0;left:58px;right:0;height:.5px;background:var(--line)}
.lrow .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:14px;font-weight:700}
.lrow .who{font-size:17px;min-width:0}
.lrow .who span{display:block;font-size:13px;color:var(--ink-2);margin-top:1px}
.lrow .amt{font-family:var(--num);font-weight:700;font-size:20px;font-variant-numeric:tabular-nums}
.lrow .amt small{font-size:14px;color:var(--ink-2);margin-right:1px}
.lrow .chev{width:8px;height:14px;stroke:var(--ink-3);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lrow.add .who{color:var(--tint)}
.foot{font-size:13px;color:var(--ink-2);margin:8px 16px 0;line-height:18px}

/* 下拉 */
.pull{position:absolute;left:50%;top:100px;width:34px;height:34px;margin-left:-17px;z-index:1;opacity:0;pointer-events:none}
@media (max-width:760px){.pull{top:52px}}

/* 详情 */
.detail{position:absolute;inset:0;z-index:10;background:var(--bg);display:none}
.detail .inner{will-change:opacity,transform}
.dnav{position:absolute;left:16px;right:16px;top:54px;height:44px;display:flex;align-items:center;z-index:2}
@media (max-width:760px){.dnav{top:6px}}
.dnav h2{position:absolute;left:0;right:0;text-align:center;font-size:17px;font-weight:600;margin:0;pointer-events:none}
.detail .content{padding-top:56px}
.dsay{font-size:22px;line-height:28px;font-weight:700;text-wrap:balance}
.dsay em{font-style:normal;color:var(--ember-ink)}
.dsub{font-size:15px;color:var(--ink-2);margin-top:4px}
.bar{padding:14px 0}
.bar+.bar{border-top:.5px solid var(--line)}
.bar .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.bar .top b{font-size:17px;font-weight:600}
.bar .top b small{font-weight:400;color:var(--ink-2);font-size:13px;margin-left:6px}
.bar .top .v{font-family:var(--num);font-weight:800;font-size:28px;line-height:1}
.bar .top .v small{font-size:13px;color:var(--ink-2)}
.bar .top .v.warn{color:var(--ember-ink)}
.bar .meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);margin-top:8px;font-variant-numeric:tabular-nums}
.bar.minor .top b{font-size:15px}
.bar.minor .top .v{font-size:20px}
.card.tight{padding-block:2px}
.edge{position:absolute;left:0;top:0;bottom:0;width:22px;z-index:12;touch-action:none}

/* 触觉提示 */
.hap{position:absolute;z-index:40;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:22px;border:2px solid var(--tint);pointer-events:none;animation:hap .5s ease-out forwards}
.hap.success{border-color:var(--relay)} .hap.warning{border-color:var(--ember-lo)}
@keyframes hap{from{transform:scale(.3);opacity:.9}to{transform:scale(1.3);opacity:0}}
.hapchip{position:absolute;z-index:41;top:58px;left:50%;transform:translateX(-50%);background:var(--ctrl-on);color:var(--ctrl-on-ink);font-size:11px;padding:3px 9px;border-radius:10px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
@media (max-width:760px){.hapchip{top:8px}}
.toast{position:absolute;z-index:41;bottom:30px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 0 0 .5px var(--glass-rim),0 4px 16px var(--glass-shade);font-size:14px;font-weight:600;padding:10px 16px;border-radius:22px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}

/* ---------- 小组件画廊 ---------- */
.gallery{position:absolute;inset:0;overflow-y:auto;scrollbar-width:none;background:linear-gradient(165deg,var(--wall-a),var(--wall-b));padding:62px 13px 40px;display:none}
@media (max-width:760px){.gallery{padding-top:14px}}
.gallery h3{color:rgba(255,255,255,.9);font-size:13px;font-weight:600;margin:6px 6px 8px}
.wgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:18px}
.w{background:var(--widget);border-radius:24px;padding:14px;aspect-ratio:1;position:relative;overflow:hidden;color:var(--ink);min-width:0;max-width:100%;display:flex;flex-direction:column;gap:8px}
.w.m{grid-column:span 2;aspect-ratio:auto;height:170px}
.w.l{grid-column:span 2;aspect-ratio:auto;height:370px}
.wh{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:600;height:20px}
.wh i{width:7px;height:7px;border-radius:4px}
.wh .rf{margin-left:auto;width:24px;height:24px;border-radius:12px;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;padding:0}
.wh .rf svg{width:12px;height:12px;stroke:var(--tint);fill:none;stroke-width:2.4;stroke-linecap:round}
.w .jar{box-shadow:none;border-radius:16px}
.w .jar .cell{padding:8px 0 7px}
.w .jar .cell .n{font-size:19px}
.w .jar .cell .n small{font-size:10px}
.w .jar .cell .lab{font-size:10px}
.w.l .jar .cell{padding:14px 0 12px}
.w.l .jar .cell .n{font-size:28px}
.w.l .jar .cell .lab{font-size:12px}
.wsm{font-size:12px;color:var(--ink-2);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wsm b{color:var(--ink);font-weight:600}
.wbig{font-family:var(--num);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.wbig small{font-size:15px;color:var(--ink-2)}
.slot{display:inline-block;overflow:hidden;vertical-align:bottom}
.slot>span{display:inline-block}
.slot.push>span{animation:push .42s cubic-bezier(.2,.8,.2,1)}
@keyframes push{from{transform:translateY(70%);opacity:0}to{transform:none;opacity:1}}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:12px;min-width:0}
.lock{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;margin-bottom:12px}
.lc{width:76px;height:76px;border-radius:38px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);display:grid;place-items:center;color:#fff;position:relative}
.lc svg{position:absolute;inset:6px;width:64px;height:64px}
.lc b{font-family:var(--num);font-size:21px;font-weight:800;margin-top:7px}
.lc .g{position:absolute;top:17px;font-size:8px;font-weight:700;opacity:.85}
.lr{height:76px;border-radius:18px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);color:#fff;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:5px;min-width:0}
.lr .t{font-size:13px;font-weight:700}
.lr .ln{display:grid;grid-template-columns:30px 1fr 34px;gap:6px;align-items:center;font-size:12px}
.lr .ln b{font-family:var(--num);font-weight:800;text-align:right;font-size:14px}
.lr .gauge{height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.lr .gauge i{display:block;height:100%;background:#fff;border-radius:3px}
.li{color:#fff;font-size:15px;font-weight:600;text-align:center;opacity:.92;margin:2px 0 16px}
.tinted .w{background:rgba(40,40,44,.5);backdrop-filter:blur(16px);color:rgba(255,255,255,.95);

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const NOW = new Date(2026, 10, 9, 18, 1, 0);
const H = 3600, D = 86400, RANGE = 7 * D;

/* ---------------- 动效：与 SwiftUI spring(response:dampingFraction:) 同公式 ---------------- */
const MOTION = {
  snappy: { response: 0.28, damping: 0.86, use: '按压、切换、标尺吸附' },
  smooth: { response: 0.48, damping: 1.0, use: '布局、展开、转场' },
  fluid:  { response: 0.70, damping: 0.72, use: '液面升降与晃动' },
};
const S = { speed: 1, rm: matchMedia('(prefers-reduced-motion: reduce)').matches };
const active = new Set(); let raf = 0, last = 0;
class Spring {
  constructor(x, token = 'smooth') { this.x = x; this.v = 0; this.t = x; this.token = token; this.subs = []; }
  on(f) { this.subs.push(f); f(this); return this; }
  emit() { for (const f of this.subs) f(this); }
  to(t, token, vel) {
    if (token) this.token = token;
    this.t = t; if (vel !== undefined) this.v = vel;
    if (S.rm) { this.x = t; this.v = 0; this.emit(); return; }
    active.add(this); kick();
  }
  set(x) { this.x = this.t = x; this.v = 0; active.delete(this); this.emit(); }
  step(dt) {
    const c = MOTION[this.token], w = 2 * Math.PI / c.response, k = w * w, d = 2 * c.damping * w;
    const n = Math.max(1, Math.ceil(dt * 480)), h = dt / n;
    for (let i = 0; i < n; i++) { const a = -k * (this.x - this.t) - d * this.v; this.v += a * h; this.x += this.v * h; }
    if (Math.abs(this.x - this.t) < 1e-4 && Math.abs(this.v) < 1e-3) { this.x = this.t; this.v = 0; active.delete(this); }
    this.emit();
  }
}
function kick() { if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } }
function loop(ts) {
  const dt = Math.min((ts - last) / 1000, 1 / 30) * S.speed; last = ts;
  for (const s of [...active]) s.step(dt);
  raf = active.size ? requestAnimationFrame(loop) : 0;   // 静止即停
}

/* ---------------- 合成数据：主看 5 小时 + 周；附加限额只进详情 ---------------- */
const PROV = { codex: { name: 'Codex', color: 'var(--codex)' }, claude: { name: 'Claude', color: 'var(--claude)' } };
const base = () => ({
  codex: { h5: { rem: .72, reset: 1 * H + 59 * 60 }, wk: { rem: .46, reset: 47 * H + 59 * 60 },
           extra: [{ name: '代码审查', rem: .81, reset: 9 * H + 59 * 60, scope: '每日' }] },
  claude: { h5: { rem: .79, reset: 2 * H + 11 * 60 }, wk: { rem: .65, reset: 71 * H + 54 * 60 },
            extra: [{ name: 'Opus', rem: .58, reset: 71 * H + 54 * 60, scope: '仅 Opus 模型 · 每周' }] },
});
const SCENES = {
  calm: d => d,
  watch: d => (d.claude.wk.rem = .12, d.claude.extra[0].rem = .40, d),
  urgent: d => (d.codex.h5.rem = 0, d.codex.wk.rem = .31, d.claude.h5.rem = .04, d.claude.wk.rem = .12, d),
  stale: d => (SCENES.watch(d), d.stale = 17, d),
  asleep: d => (d.asleep = true, d),
};
const WIN = { h5: '5 小时', wk: '本周' };
const WALLET = () => ({ ds: { cny: 128.36, gift: 28.36, top: 100 }, relay: { usd: 12.35 } });
let wallet = WALLET();
let state = { scene: 'watch', relay: true, data: SCENES.watch(base()), view: 'app', tint: false };
const mains = () => Object.keys(PROV).flatMap(p => ['h5', 'wk'].map(k => ({ ...state.data[p][k], p, k, name: WIN[k] })));

/* ---------------- 阈值与文案（展示层单一真身） ---------------- */
const TH = { watch: .20, urgent: .05 };
const isWarn = r => r <= TH.watch;
function fmtLeft(s) {
  s = Math.max(0, Math.round(s));
  const d = Math.floor(s / D), h = Math.floor(s % D / H), m = Math.floor(s % H / 60);
  if (d) return `${d}天${h}时`; if (h) return `${h}时${m}分`; return `${Math.max(m, 1)}分`;
}
const dayName = t => '周' + '日一二三四五六'[t.getDay()];
function fmtAt(s) {
  const t = new Date(NOW.getTime() + s * 1000), dd = Math.round((new Date(t).setHours(0,0,0,0) - new Date(NOW).setHours(0,0,0,0)) / 864e5);
  const hm = `${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  return `${dd === 0 ? '今天' : dd === 1 ? '明天' : dayName(t)} ${hm}`;
}
function mood() {
  if (state.data.asleep) return 'asleep';
  const m = Math.min(...mains().map(w => w.rem));
  return m <= TH.urgent ? 'urgent' : m <= TH.watch ? 'watch' : 'calm';
}
const tightest = () => mains().reduce((a, b) => (b.rem < a.rem || (b.rem === a.rem && b.reset < a.reset)) ? b : a);

/* ---------------- 熊 ---------------- */
function bearSVG(m) {
  const ink = '#2b2118';
  const eyes = {
    calm: `<path d="M15 21q2-2.4 4 0M25 21q2-2.4 4 0" stroke="${ink}" stroke-width="1.6" fill="none" stroke-linecap="round"/>`,
    watch: `<circle cx="17" cy="21" r="1.6" fill="${ink}"/><circle cx="27" cy="21" r="1.6" fill="${ink}"/>`,
    urgent: `<circle cx="17" cy="20.5" r="2" fill="${ink}"/><circle cx="27" cy="20.5" r="2" fill="${ink}"/><path d="M34.5 13q2 3 0 4.5q-2-1.5 0-4.5z" fill="#64D2FF"/>`,
    asleep: `<path d="M15 21.5h4M25 21.5h4" stroke="${ink}" stroke-width="1.6" stroke-linecap="round"/><text x="34" y="9" font-size="7" font-weight="700" fill="var(--ink-2)">z</text>`,
  }[m];
  const mouth = {
    calm: `<path d="M20 28q2 1.8 4 0" stroke="${ink}" stroke-width="1.4" fill="none" stroke-linecap="round"/>`,
    watch: `<path d="M20.2 28.2h3.6" stroke="${ink}" stroke-width="1.4" stroke-linecap="round"/>`,
    urgent: `<ellipse cx="22" cy="28.4" rx="1.5" ry="1.8" fill="${ink}"/>`,
    asleep: `<path d="M20.5 28.2q1.5 .8 3 0" stroke="${ink}" stroke-width="1.3" fill="none" stroke-linecap="round"/>`,
  }[m];
  return `<circle cx="11" cy="11" r="5.5" fill="var(--bear)"/><circle cx="33" cy="11" r="5.5" fill="var(--bear)"/>
  <circle cx="11" cy="11" r="2.6" fill="var(--bear-muzzle)"/><circle cx="33" cy="11" r="2.6" fill="var(--bear-muzzle)"/>
  <circle cx="22" cy="23" r="15" fill="var(--bear)"/><ellipse cx="22" cy="27.5" rx="6.5" ry="5" fill="var(--bear-muzzle)"/>
  <ellipse cx="22" cy="25" rx="1.8" ry="1.3" fill="${ink}"/>${eyes}${mouth}`;
}
const bearScale = new Spring(1, 'snappy').on(s => { $('#bear').style.transform = `scale(${s.x})`; });
let lastMood = null;
function renderBear() {
  const m = mood(); $('#bear').innerHTML = bearSVG(m);
  if (lastMood && lastMood !== m) { bearScale.set(.84); bearScale.to(1, 'snappy', 4); if (m === 'urgent') haptic('warning', $('#bear')); }
  lastMood = m;
}

/* ---------------- 双格蜜罐：罐壳是 Liquid Glass ---------------- */
let uid = 0;
class Jar {
  constructor(el, w, h, r) {
    this.w = w; this.h = h; const id = 'j' + (++uid); const m = w / 2;
    el.classList.add('jar'); el.style.borderRadius = r + 'px';
    el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true">
      <defs><clipPath id="${id}c"><rect width="${w}" height="${h}" rx="${r}"/></clipPath>
      ${[0, 1].map(i => `<linearGradient id="${id}g${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0"/><stop offset="1"/></linearGradient>`).join('')}
      <linearGradient id="${id}t" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--glass-rim)"/><stop offset=".35" stop-color="var(--glass-rim)" stop-opacity="0"/></linearGradient></defs>
      <rect width="${w}" height="${h}" rx="${r}" fill="var(--glass-in)"/>
      <g clip-path="url(#${id}c)">
        <path class="l0" fill="url(#${id}g0)"/><path class="l1" fill="url(#${id}g1)"/>
        <path class="m0" fill="none" stroke="var(--sheen)" stroke-width="1.5"/><path class="m1" fill="none" stroke="var(--sheen)" stroke-width="1.5"/>
        <line x1="${m}" y1="0" x2="${m}" y2="${h}" stroke="var(--card)" stroke-width="3"/>
      </g>
      <rect x=".5" y=".5" width="${w - 1}" height="${h - 1}" rx="${r - .5}" fill="none" stroke="url(#${id}t)" stroke-width="1"/>
      <rect class="rim" x=".25" y=".25" width="${w - .5}" height="${h - .5}" rx="${r}" fill="none" stroke="var(--line)" stroke-width=".5"/></svg>
      <div class="cells"><div class="cell"><span class="n"></span><span class="lab">5 小时</span></div><div class="cell"><span class="n"></span><span class="lab">本周</span></div></div>`;
    this.svg = el.firstElementChild; this.cells = el.querySelectorAll('.cell');
    this.liq = [$('.l0', el), $('.l1', el)]; this.men = [$('.m0', el), $('.m1', el)];
    this.stops = [0, 1].map(i => this.svg.querySelectorAll(`#${id}g${i} stop`));
    this.rimEl = $('.rim', this.svg); this.asleep = false;
    this.lv = [0, 1].map(i => new Spring(0, 'fluid').on(s => this.draw(i, s)));
  }
  draw(i, s) {
    const { w, h } = this, x0 = i ? w / 2 : 0, cw = w / 2, L = Math.max(0, Math.min(1.03, s.x));
    const amp = S.rm ? 0 : Math.max(-9, Math.min(9, s.v * h * 0.03)), y = h - L * h, tilt = amp * .5;   // 晃动由液位速度推出
    const top = `M${x0} ${y + tilt} Q${x0 + cw * .25} ${y - amp + tilt * .5} ${x0 + cw * .5} ${y} T${x0 + cw} ${y - tilt}`;
    this.liq[i].setAttribute('d', `${top} L${x0 + cw} ${h + 2} L${x0} ${h + 2}Z`);
    this.men[i].setAttribute('d', top); this.men[i].style.opacity = L > .03 ? 1 : 0;
    this.cells[i].querySelector('.n').innerHTML = this.asleep ? '–' : `${Math.round(Math.max(0, Math.min(1, s.x)) * 100)}<small>%</small>`;
    this.cells[i].querySelector('.lab').classList.toggle('dry', L < .16);
  }
  paint(i, warn) {
    this.stops[i][0].style.stopColor = warn ? 'var(--ember-hi)' : 'var(--honey-hi)';
    this.stops[i][1].style.stopColor = warn ? 'var(--ember-lo)' : 'var(--honey-lo)';
    this.cells[i].querySelector('.n').classList.toggle('warn', warn);
    this.cells[i].querySelector('.lab').classList.toggle('onwarn', warn);
  }
  look({ stale, asleep }) {
    this.asleep = asleep;
    this.svg.style.filter = stale ? 'saturate(.2)' : '';
    for (const l of this.liq) l.style.opacity = stale ? .5 : 1;
    this.rimEl.setAttribute('stroke-dasharray', asleep ? '4 5' : '');
  }
  to(i, v, animate) { animate ? this.lv[i].to(v, 'fluid') : this.lv[i].set(v); }
}

/* ---------------- 首页 ---------------- */
const jars = {};
function buildJars() {
  const box = $('#jars'); box.innerHTML = '';
  for (const p in PROV) {
    const b = document.createElement('button'); b.className = 'jarbtn'; b.dataset.p = p; b.setAttribute('data-id', 'provider-' + p);
    b.setAttribute('aria-label', PROV[p].name + ' 详情');
    b.innerHTML = `<div class="jhead"><i style="background:${PROV[p].color}"></i>${PROV[p].name}<span class="tag"></span></div><div class="jw"></div>
      <div class="under"><span></span><span></span></div>`;
    box.appendChild(b);
    jars[p] = { jar: new Jar($('.jw', b), 156, 220, 28), el: b };
    pressable(b, () => openDetail(p, b));
  }
}
const CLK = '<svg class="clk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const forecast = (w, t) => t >= w.reset ? 1 : w.rem;
const chevron = '<svg viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg>';
function renderHome(animate = true) {
  const d = state.data, t = scrubT.x;
  for (const p in PROV) {
    const { jar, el } = jars[p];
    jar.look({ stale: !!d.stale, asleep: !!d.asleep });
    $('.tag', el).innerHTML = d.asleep ? '<span style="color:var(--tint)">连接</span>' : chevron;
    ['h5', 'wk'].forEach((k, i) => {
      const w = d[p][k], lv = d.asleep ? 0 : forecast(w, t);
      jar.paint(i, !d.asleep && isWarn(lv)); jar.to(i, lv, animate);
      el.querySelectorAll('.under span')[i].innerHTML = d.asleep ? '未连接' : (t >= w.reset ? '<b>已回满</b>' : `${CLK}<b>${fmtLeft(w.reset - t)}</b>`);
    });
  }
  $('#freshness').textContent = d.asleep ? '' : d.stale ? `${d.stale} 分钟前` : '刚刚更新';
  renderHero(); renderBear(); renderRuler(); renderPurse();
}
function renderHero() {
  const d = state.data, say = $('#say'), sub = $('#sub');
  if (d.asleep) { say.textContent = '还没连上账户'; sub.textContent = '轻松熊先睡会儿'; return; }
  const t = tightest(), m = mood(), who = `${PROV[t.p].name} ${t.k === 'h5' ? '5 小时' : '周额度'}`;
  if (m === 'calm') { say.textContent = '额度都够用'; sub.textContent = `最低是 ${who} ${Math.round(t.rem * 100)}%`; }
  else {
    say.innerHTML = `<span class="nb">${who}</span>` + (t.rem === 0 ? `<span class="nb"><em>用完了</em></span>` : `<span class="nb">只剩 <em>${Math.round(t.rem * 100)}%</em></span>`);
    sub.textContent = `${fmtAt(t.reset)} 回满，还要 ${fmtLeft(t.reset)}`;
  }
}
function renderPurse() {
  const box = $('#purseWrap');
  if (state.data.asleep) { box.innerHTML = ''; return; }
  const ic = (bg, t) => `<span class="ic" style="background:${bg}">${t}</span>`;
  box.innerHTML = `<div class="shead"><span>余额</span></div><div class="list">
    <button class="lrow" data-id="provider-deepseek">${ic('var(--deepseek)', 'D')}<div class="who">DeepSeek<span>赠送 ${wallet.ds.gift.toFixed(2)} · 充值 ${wallet.ds.top.toFixed(2)}</span></div>
      <div class="amt"><small>¥</small><span id="dsAmt">${wallet.ds.cny.toFixed(2)}</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>
    ${state.relay ? `<button class="lrow" data-id="relay-card">${ic('var(--relay)', '中')}<div class="who">我的中转<span>APIKEY.FAN</span></div>
      <div class="amt"><small>$</small><span>${wallet.relay.usd.toFixed(2)}</span></div><svg class="chev" viewBox="0 0 8 14"><path d="M1 1l6 6-6 6"/></svg></button>`
      : `<button class="lrow add" data-id="relay-add">${ic('var(--fill)', '<span style="color:var(--tint);font-size:20px;font-weight:400">+</span>')}<div class="who">添加中转站</div><span></span><span></span></button>`}</div>
    <div class="foot">各窗口独立计算，比例不能相加。</div>`;
}

/* ---------------- 时间尺 ---------------- */
const scrubT = new Spring(0, 'smooth');
function renderRuler() {
  const ticks = $('#ticks'), dots = $('#dots'), track = $('#track');
  const mid0 = (24 - NOW.getHours()) * H - NOW.getMinutes() * 60;
  let html = '';
  for (let i = 0; i < 7; i++) {
    const s = mid0 + i * D; if (s > RANGE - 2 * H) break;
    const t = new Date(NOW.getTime() + s * 1000);
    html += `<span class="mid" style="left:${s / RANGE * 100}%"></span>`;
    if (s / RANGE < .95) html += `<span class="tick" style="left:${(s + 12 * H) / RANGE * 100}%">${dayName(t)}</span>`;
  }
  ticks.innerHTML = html;
  if (state.data.asleep) { dots.innerHTML = ''; track.style.opacity = .4; return; }
  track.style.opacity = 1;
  const placed = [];
  dots.innerHTML = mains().filter(w => w.reset <= RANGE).sort((a, b) => a.reset - b.reset).map(w => {
    const x = w.reset / RANGE; let lift = 0; while (placed.some(q => Math.abs(q.x - x) < .025 && q.lift === lift)) lift++;
    placed.push({ x, lift });
    return `<span class="rdot" style="left:${x * 100}%;top:${10 - lift * 11}px;background:${PROV[w.p].color}" title="${PROV[w.p].name} ${w.name}"></span>`;
  }).join('');
}

function scrubber() {
  const track = $('#track'); let drag = false, lastSnap = null;
  const toT = e => { const r = track.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * RANGE; };
  const move = e => {
    let t = toT(e), snap = null;
    for (const w of mains()) if (w.reset <= RANGE && Math.abs(w.reset - t) < RANGE * .02) { t = w.reset; snap = w.reset; }
    if (snap !== null && snap !== lastSnap) haptic('selection', $('#thumb .knob'));
    lastSnap = snap; scrubT.to(t, 'snappy');
  };
  track.addEventListener('pointerdown', e => { if (state.data.asleep) return; drag = true; track.setPointerCapture(e.pointerId); track.style.cursor = 'grabbing'; move(e); });
  track.addEventListener('pointermove', e => { if (drag) move(e); });
  const end = () => { if (!drag) return; drag = false; lastSnap = null; track.style.cursor = ''; scrubT.to(0, 'smooth'); };
  track.addEventListener('pointerup', end); track.addEventListener('pointercancel', end);
}

function pressable(el, onTap) {
  const sc = new Spring(1, 'snappy').on(s => { el.style.transform = s.x === 1 ? '' : `scale(${s.x})`; });
  let down = null;
  el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; sc.to(.965, 'snappy'); });
  el.addEventListener('pointermove', e => { if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) > 10) { down = null; sc.to(1, 'snappy'); } });
  el.addEventListener('pointerup', () => { if (down) { sc.to(1, 'snappy'); onTap(); } down = null; });
  el.addEventListener('pointerleave', () => { down = null; sc.to(1, 'snappy'); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onTap(); } });
}

  seg('#segSpeed', v => { S.speed = +v; });
  seg('#segRM', v => { S.rm = v === 'on'; });
  seg('#segTheme', v => { if (v === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = v; });
  seg('#segTint', v => { state.tint = v === 'on'; renderGallery(); });
  if (S.rm) document.querySelectorAll('#segRM button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === 'on'));
  renderHome(false);   // 冷启动：首帧直接是缓存数据，不放入场动画
}
init();
})();
</script>
