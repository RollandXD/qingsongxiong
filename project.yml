name: QingSongXiong
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: io.github.rollandxd.qingsongxiong
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  BearKit:
    path: Packages/BearKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "9"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    BEAR_APP_GROUP: group.io.github.rollandxd.qingsongxiong
    BEAR_KEYCHAIN_SUFFIX: io.github.rollandxd.qingsongxiong.shared
targets:
  QingSongXiong:
    type: application
    platform: iOS
    sources:
      - AppShell
      - SharedUI
      - path: Resources/Assets.xcassets
      - path: Resources/AppLocalization
      - path: Resources/Legal
    info:
      path: Configuration/App-Info.plist
      properties:
        CFBundleDisplayName: QingSongXiong
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        BearBuildMode: design-preview
        BearEnabledProviders: [codex, claude, deepseek]
        CFBundleURLTypes:
          - CFBundleURLName: io.github.rollandxd.qingsongxiong
            CFBundleURLSchemes: [qingsongxiong]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [io.github.rollandxd.qingsongxiong.refresh]
        BearAppGroupIdentifier: $(BEAR_APP_GROUP)
        BearKeychainGroupSuffix: $(BEAR_KEYCHAIN_SUFFIX)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rollandxd.qingsongxiong
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Configuration/Shared.entitlements
    dependencies:
      - package: BearKit
        product: BearFoundation
      - package: BearKit
        product: BearPlatform
      - package: BearKit
        product: BearDesignSystem
      - package: BearKit
        product: AIUsageData
      - package: BearKit
        product: AIUsageDomain
      - package: BearKit
        product: AIUsageAuth
      - package: BearKit
        product: AIUsageFeature
      - package: BearKit
        product: AIUsagePresentation
      - target: QingSongXiongWidgets
        embed: true
  QingSongXiongWidgets:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension
      - SharedUI
      - path: Resources/WidgetLocalization
    info:
      path: Configuration/Widget-Info.plist
      properties:
        CFBundleDisplayName: QingSongXiong Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        BearAppGroupIdentifier: $(BEAR_APP_GROUP)
        BearKeychainGroupSuffix: $(BEAR_KEYCHAIN_SUFFIX)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rollandxd.qingsongxiong.widgets
        CODE_SIGN_ENTITLEMENTS: Configuration/Shared.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: BearKit
        product: BearFoundation
      - package: BearKit
        product: BearPlatform
      - package: BearKit
        product: BearDesignSystem
      - package: BearKit
        product: AIUsageDomain
      - package: BearKit
        product: AIUsageData
      - package: BearKit
        product: AIUsagePresentation
  QingSongXiongUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rollandxd.qingsongxiong.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: QingSongXiong
schemes:
  QingSongXiong:
    build:
      targets:
        QingSongXiong: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [QingSongXiongUITests]
    archive:
      config: Release
