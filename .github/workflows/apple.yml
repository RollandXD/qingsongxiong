name: Apple 原生验证与待重签安装包
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md', 'docs/**', LICENSE, NOTICE]
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', LICENSE, NOTICE]
  workflow_dispatch:
    inputs:
      ui_tests:
        description: '可选：单个 UI 测试标识（留空运行全部）'
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: apple-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 固定版本生成 Xcode 工程
        run: bash scripts/install_xcodegen.sh
      - name: 核验 iPhone 16 Pro 测试设备
        timeout-minutes: 3
        run: bash scripts/apple_build.sh select-simulator
      - name: 架构与 Swift 单元测试
        timeout-minutes: 10
        run: bash scripts/apple_build.sh checks
      - name: 真机目标构建与待重签 IPA
        run: bash scripts/apple_build.sh device
      - name: 保存待重签 IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QingSongXiong-verification-${{ github.sha }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
          path: |
            output/*.ipa
            output/SHA256SUMS.txt
            output/build-status.json
      - name: 原生 UI 测试与截图
        timeout-minutes: 25
        env:
          BEAR_UI_TEST: ${{ inputs.ui_tests }}
        run: bash scripts/apple_build.sh ui
      - name: 导出原生截图
        if: always()
        run: bash scripts/apple_build.sh screenshots
      - name: 保存原生 UI 截图
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QingSongXiong-screenshots-${{ github.sha }}
          retention-days: 1
          compression-level: 0 # PNG/JPEG/视频已经压缩，避免导出包再次高压缩阻塞队列
          if-no-files-found: warn
          path: |
            output/screenshots/
      - name: 导出原速与四分之一慢放巡览
        if: always()
        timeout-minutes: 8
        run: |
          if grep -q 'BEAR_MOTION_END' output/ui-tests.log 2>/dev/null; then
            if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
            python3 scripts/export_motion.py output
          else
            printf '%s\n' '本次没有完成动效巡览；不生成替代影片。'
          fi
      - name: 保存合成数据原速动效录像
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QingSongXiong-motion-${{ github.sha }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn
          path: |
            output/native-motion.mp4
            output/motion-tour-1x.mp4
            output/motion-tour-025x.mp4
            output/motion-tour.json
            output/recording.json
            output/recording.log
            output/displays.txt
            output/simulator-profile.json
            output/ui-tests.log
