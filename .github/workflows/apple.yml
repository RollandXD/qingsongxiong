name: Apple 骨架验证与待重签安装包
on:
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md', 'docs/**', LICENSE, NOTICE]
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', LICENSE, NOTICE]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apple:
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: 固定版本生成 Xcode 工程
        run: bash scripts/install_xcodegen.sh
      - name: 架构与 Swift 单元测试
        run: bash scripts/apple_build.sh checks
      - name: 真机目标构建与待重签 IPA
        run: bash scripts/apple_build.sh device
      - name: 保存待重签 IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QingSongXiong-verification-${{ github.sha }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: error
          path: |
            output/*.ipa
            output/SHA256SUMS.txt
            output/build-status.json
      - name: 原生 UI 测试与截图
        timeout-minutes: 25
        run: bash scripts/apple_build.sh ui
      - name: 导出原生截图
        if: always()
        run: bash scripts/apple_build.sh screenshots
      - name: 保存原生 UI 截图
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QingSongXiong-screenshots-${{ github.sha }}
          retention-days: 1
          compression-level: 9
          if-no-files-found: warn
          path: |
            output/screenshots/
